interface:
  display_name: "患者全病程数据生成"
  short_description: "依据患者Excel生成全病程明细、健康方案、用药跟踪及不良反应清单"
  default_prompt: "Use $generating-patient-full-course-data for: 生成患者明细 依据文件：<Excel路径> 公司：<公司名称，可选> 最少种数：<1～5，可选> 模式：<真实、模拟或虚构测试，无模拟授权时默认真实>; 生成健康管理方案 依据文件：<Excel路径> 产品：<当前产品名称>; 生成跟踪提醒和用药清单 依据文件：<Excel路径> 服务周期 YYYY-MM-DD 至 YYYY-MM-DD; 生成不良反应清单 依据文件：<Excel路径> 数量：N; or 生成洞察报告 产品：<产品> 服务周期：YYYY-MM-DD 至 YYYY-MM-DD 依据以下文件：<6份必填Excel，不良反应清单选填>; 生成深度访谈 调研时间：<时间> 调研数量：<人数> 调研方式=<电话随访|深度访谈，可选，默认深度访谈> 是否轻度：<是|否，可选，默认否> 依据以下文件：<5或6份Excel>. 患者明细输出18列并在手术名称后增加耗材名称；山东利赛器械耗材入列但产品名不进处方，湖南昕敷佳器械耗材入列且处方末尾增加耗材名称段；下游阶段兼容旧17列。患者明细接受“可以AI模拟病情增加药品种数”等授权，模拟模式最少种数默认3，按相容情境研究3～5种独立用药；实质处方去重目标为ceil(sqrt(记录数))，库不足时先研究扩库，不静默降低目标；仅文件名标记模拟，生成单元格不含模拟说明。生成深度访谈默认授权AI模拟，无需另行确认，文件名标记模拟。电话随访只生成访谈记录明细1份，深度访谈生成分析报告及记录明细2份；调研参数逐行填写。洞察报告默认遵循内置固定模板；可额外提供输出Word文件模板作为视觉版式来源。"

policy:
  allow_implicit_invocation: true
