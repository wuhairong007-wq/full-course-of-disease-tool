interface:
  display_name: "患者全病程数据生成"
  short_description: "依据患者Excel生成全病程明细、健康方案、用药跟踪及不良反应清单"
  default_prompt: "Use $generating-patient-full-course-data for: 生成患者明细 依据文件：<Excel路径> 公司：<公司名称，可选>; 生成健康管理方案 依据文件：<Excel路径>; 生成跟踪提醒和用药清单 依据文件：<Excel路径> 服务周期 YYYY-MM-DD 至 YYYY-MM-DD; 生成不良反应清单 依据文件：<Excel路径> 数量：N; or 生成洞察报告 产品：<产品> 服务周期：YYYY-MM-DD 至 YYYY-MM-DD 依据以下文件：<7份Excel>. 洞察报告默认遵循内置固定模板；可额外提供输出Word文件模板作为视觉版式来源。"

policy:
  allow_implicit_invocation: true
